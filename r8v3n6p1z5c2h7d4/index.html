  var loaded=new Promise(function(r){if(document.readyState==='complete')r();else window.addEventListener('load',function(){r()})});
  crypto.subtle.importKey('raw',kb,{name:'AES-GCM'},false,['decrypt']).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
  }).then(function(buf){
    var html=new TextDecoder('utf-8').decode(buf);
    return loaded.then(function(){setTimeout(function(){document.open();document.write(html);document.close()},0)});
  }).catch(function(){fail('解密失败：链接不完整或密钥不对。请复制完整链接再打开。')});
