<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0B0D14" />
<title>灵触万象 · 支付宝「碰一下」NFC 数字文创 · B端路演交互原型</title>
<style>
:root{--bg:#0B0D14;--bg2:#121522;--bg3:#181c2c;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.075);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--text:#EEF0F8;--sub:#9aa1b8;--mute:#646b82;--gold:#F5C451;--gold2:#FFE7A6;--gold3:#C8922A;--cyan:#3EF0FF;--violet:#9B5CFF;--pink:#FF4FD8;--blue:#1677FF;--green:#3DDC97;--red:#FF5A6A;--holo:linear-gradient(115deg,#3EF0FF 0%,#9B5CFF 35%,#FF4FD8 65%,#F5C451 100%);--goldg:linear-gradient(135deg,#FFE7A6 0%,#F5C451 40%,#C8922A 100%);--ease:cubic-bezier(.2,.9,.25,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace}
.serif{font-family:"Songti SC","Noto Serif SC","STSong",serif}
.aurora{position:fixed;inset:0;pointer-events:none;background:radial-gradient(800px 500px at 8% 8%,rgba(155,92,255,.18),transparent 60%),radial-gradient(700px 500px at 92% 85%,rgba(62,240,255,.12),transparent 60%),radial-gradient(600px 400px at 55% 0%,rgba(245,196,81,.10),transparent 60%)}
.aurora::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 30%,transparent 80%);mask-image:radial-gradient(circle at 50% 50%,#000 30%,transparent 80%)}
.stage{position:relative;display:flex;align-items:center;justify-content:center;gap:44px;height:100vh;padding:16px 24px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}::-webkit-scrollbar-track{background:transparent}

/* ===== Console ===== */
.console{width:430px;flex:none;max-height:calc(100vh - 32px);overflow-y:auto;padding:22px;border-radius:24px;background:linear-gradient(180deg,rgba(20,23,36,.88),rgba(12,14,22,.88));border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(20px)}
.con-head{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.con-logo{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;background:conic-gradient(from 200deg,#3EF0FF,#9B5CFF,#FF4FD8,#F5C451,#3EF0FF);box-shadow:0 0 30px rgba(155,92,255,.45);color:#0B0D14}
.con-logo svg{width:28px;height:28px}
.con-kicker{font-size:10px;letter-spacing:3px;color:var(--cyan);font-weight:700}
.con-head h2{font-size:19px;letter-spacing:1px;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent}
.con-head p{font-size:12px;color:var(--sub)}
.con-sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.con-sec-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;margin-bottom:10px}
.kbd{font:600 10px/1 monospace;color:var(--mute);border:1px solid var(--line2);border-radius:5px;padding:3px 6px}
.con-scene{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:16px;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 14%,transparent),rgba(255,255,255,.02));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);margin-bottom:8px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.con-scene:hover{transform:translateX(3px);box-shadow:0 0 0 1px var(--c),0 8px 30px color-mix(in srgb,var(--c) 25%,transparent)}
.con-scene::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:skewX(-20deg);transition:left .6s}
.con-scene:hover::after{left:110%}
.con-scene.running{box-shadow:0 0 0 2px var(--c),0 0 30px color-mix(in srgb,var(--c) 45%,transparent)}
.cs-ic{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:22px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 50%,transparent)}
.cs-txt{flex:1;min-width:0}
.cs-txt b{font-size:13.5px;display:block;padding-right:18px}
.cs-txt small{display:block;color:var(--sub);font-size:11.5px;line-height:1.45;margin-top:2px}
.cs-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.cs-tags i{font-style:normal;font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--c)}
.cs-key{position:absolute;right:10px;top:10px;font:600 10px/1.4 monospace;color:var(--mute);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{padding:9px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);transition:.3s}
.kpi span{display:block;font-size:10.5px;color:var(--sub);white-space:nowrap}
.kpi b{font-size:17px;font-family:Georgia,serif}
.kpi.bump{border-color:var(--gold);box-shadow:0 0 18px rgba(245,196,81,.35);animation:bump .6s}
@keyframes bump{40%{transform:scale(1.07)}}
.log{margin-top:10px;max-height:150px;overflow-y:auto;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);padding:6px 8px;font-size:11.5px}
.lg{display:flex;gap:8px;padding:3px 0;color:var(--sub);border-bottom:1px dashed rgba(255,255,255,.05)}
.lg time{font-family:monospace;color:var(--mute);flex:none}
.lg.new{color:var(--text);animation:fadeIn .5s}
.lg-empty{color:var(--mute);padding:6px 0;text-align:center}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:10px}
.fl-step{position:relative;padding:8px 6px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:center}
.fl-step b{display:block;font-size:11px;color:var(--gold)}
.fl-step span{font-size:9.5px;color:var(--sub);line-height:1.3;display:block;margin-top:2px}
.fl-step:not(:last-child)::after{content:"›";position:absolute;right:-7px;top:50%;transform:translateY(-50%);color:var(--cyan);font-weight:700;z-index:1}
table.bom{width:100%;border-collapse:collapse;font-size:11.5px}
table.bom th{text-align:left;font-weight:600;color:var(--sub);font-size:10.5px;padding:6px 6px;border-bottom:1px solid var(--line2)}
table.bom td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.bom td b{color:var(--gold);white-space:nowrap}
table.bom tr.hl td{background:rgba(245,196,81,.07)}
.tier-chip{font-size:9.5px;padding:1px 6px;border-radius:5px;white-space:nowrap}
.tier-chip.public{background:rgba(62,240,255,.12);color:var(--cyan)}
.tier-chip.bound{background:rgba(245,196,81,.14);color:var(--gold)}
.con-btns{display:flex;gap:8px;margin-top:10px}
.con-btns button,.con-foot button{flex:1;padding:9px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;font-weight:600;transition:.2s}
.con-btns button:hover,.con-foot button:hover{border-color:var(--gold);color:var(--gold)}
.con-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.con-foot p{width:100%;font-size:11px;color:var(--mute);line-height:1.5}

/* ===== Phone ===== */
.phone-wrap{position:relative;flex:none;width:426px;height:898px}
.phone{position:absolute;left:0;top:0;width:426px;height:898px;transform-origin:top left;border-radius:68px;padding:12px;background:linear-gradient(145deg,#4a4d57,#1c1e24 28%,#2e313a 62%,#17191e);box-shadow:0 0 0 1.5px #5c616e inset,0 0 0 3px #0b0c0f,0 40px 100px rgba(0,0,0,.7),0 0 140px rgba(155,92,255,.16)}
.pb{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#2a2c33,#555a66)}
.pb-act{left:-3px;top:150px;height:34px}.pb-vu{left:-3px;top:205px;height:62px}.pb-vd{left:-3px;top:280px;height:62px}.pb-pw{right:-3px;top:225px;height:98px}.pb-cam{right:-3px;top:520px;height:58px;opacity:.7}
.screen{--sb:54px;position:relative;width:402px;height:874px;border-radius:56px;overflow:hidden;background:var(--bg);isolation:isolate;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(500px 300px at 0% 0%,rgba(155,92,255,.13),transparent 70%),radial-gradient(400px 300px at 100% 40%,rgba(62,240,255,.07),transparent 70%),radial-gradient(400px 300px at 50% 100%,rgba(245,196,81,.06),transparent 70%);z-index:0}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:96;transition:all .55s cubic-bezier(.2,1.2,.3,1);display:flex;align-items:center;overflow:hidden;color:#fff;font-size:13px;font-weight:600}
.isl-cam{position:absolute;right:13px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2a3550,#05060a 70%)}
.isl-content{opacity:0;display:flex;align-items:center;gap:10px;padding:0 16px;white-space:nowrap;transition:opacity .3s}
.island.expand{width:352px;height:62px;border-radius:32px}
.island.expand .isl-content{opacity:1;transition-delay:.2s}
.island.expand .isl-cam{opacity:0}
.isl-ic{width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none;box-shadow:0 0 16px rgba(22,119,255,.7)}
.isl-ic svg{width:20px;height:20px;color:#fff}
.island.ok .isl-ic{background:var(--green);box-shadow:0 0 16px rgba(61,220,151,.7)}
.isl-txt small{display:block;font-size:10.5px;color:#9aa1b8;font-weight:500}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 48px;font-weight:600;font-size:16px;z-index:95;pointer-events:none}
.sb-r{display:flex;align-items:center;gap:6px;font-size:13px}
.sb-r svg{display:block}
.navbar{position:absolute;top:var(--sb);left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;z-index:40;background:linear-gradient(180deg,rgba(11,13,20,.92),rgba(11,13,20,.72));backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.04)}
.navbar::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:60px;background:rgba(11,13,20,.92)}
.nav-title{font-weight:700;font-size:16px;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-nfc{position:absolute;left:12px;top:6px;height:32px;padding:0 10px 0 6px;border-radius:16px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1677FF,#3EF0FF);box-shadow:0 0 16px rgba(22,119,255,.55)}
.nav-nfc svg{width:18px;height:18px}
.nav-nfc::after{content:"";position:absolute;inset:-3px;border-radius:19px;border:1.5px solid rgba(62,240,255,.6);animation:navPulse 2s infinite}
@keyframes navPulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.capsule{position:absolute;right:12px;top:6px;height:32px;width:88px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);display:flex;align-items:center}
.capsule button{flex:1;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:1px}
.capsule i{width:1px;height:18px;background:rgba(255,255,255,.22)}
.content{position:absolute;top:calc(var(--sb) + 44px);left:0;right:0;bottom:0;z-index:1}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:12px 14px 120px;display:none;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.active{display:block;animation:pageIn .4s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tabbar{position:absolute;left:10px;right:10px;bottom:24px;height:64px;border-radius:26px;background:rgba(22,25,38,.66);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);display:flex;align-items:center;z-index:45}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--sub);position:relative;padding-top:2px;transition:color .2s}
.tab svg{width:24px;height:24px;transition:transform .3s var(--ease)}
.tab.active{color:var(--gold)}
.tab.active svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 6px rgba(245,196,81,.6))}
.tab .dot{position:absolute;top:-4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);font:700 10px/17px sans-serif;color:#fff;font-style:normal;box-shadow:0 0 0 2px #151826;animation:bump .6s}
.tap-btn{flex:none;width:62px;height:62px;margin:-30px 4px 0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:radial-gradient(circle at 35% 30%,#4aa8ff,#1677FF 55%,#0b4fc4);box-shadow:0 0 0 4px #0B0D14,0 0 0 5.5px rgba(62,240,255,.45),0 10px 30px rgba(22,119,255,.6);position:relative}
.tap-btn svg{width:24px;height:24px}
.tap-btn small{font-size:10px;font-weight:700;margin-top:-1px}
.tap-ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(62,240,255,.55);animation:navPulse 2.2s infinite}
.home-ind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.75);transform:translateX(-50%);z-index:97;pointer-events:none}

/* ===== Layer / modal / toast ===== */
.layer{position:absolute;inset:0;z-index:80;pointer-events:none}
.modal{position:absolute;inset:0;pointer-events:auto}
.modal-mask{position:absolute;inset:0;background:rgba(3,4,8,.62);backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}
.modal.show .modal-mask{opacity:1}
.modal-body{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;overflow-x:hidden;border-radius:28px 28px 0 0;background:linear-gradient(180deg,#171a2a,#0d0f18);border-top:1px solid rgba(255,255,255,.14);padding:18px 16px 44px;transform:translateY(100%);transition:transform .42s var(--ease);scrollbar-width:none}
.modal-body::-webkit-scrollbar{display:none}
.modal.show .modal-body{transform:none}
.modal.full .modal-body{top:0;max-height:none;border-radius:0;border:0;padding-top:calc(var(--sb) + 10px);background:radial-gradient(500px 400px at 0% 0%,rgba(155,92,255,.16),transparent 70%),radial-gradient(400px 400px at 100% 60%,rgba(62,240,255,.08),transparent 70%),#0B0D14}
.modal.center .modal-body{left:20px;right:20px;top:50%;bottom:auto;max-height:80%;border-radius:24px;border:1px solid rgba(255,255,255,.14);transform:translateY(-46%) scale(.92);opacity:0;transition:transform .35s var(--ease),opacity .25s;padding-bottom:20px}
.modal.center.show .modal-body{transform:translateY(-50%) scale(1);opacity:1}
.sheet-handle{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:-6px auto 12px}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.m-head h3{font-size:18px;line-height:1.3}
.m-kicker{font-size:11px;color:var(--cyan);letter-spacing:.5px;margin-bottom:2px}
.m-close{width:32px;height:32px;flex:none;border-radius:50%;background:rgba(255,255,255,.09);font-size:14px;display:grid;place-items:center}
.toasts{position:absolute;left:0;right:0;bottom:112px;z-index:110;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{max-width:84%;padding:9px 16px;border-radius:20px;background:rgba(20,22,34,.92);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13px;opacity:0;transform:translateY(10px) scale(.96);transition:.3s var(--ease);text-align:center}
.toast i{font-style:normal;margin-right:6px}
.toast.show{opacity:1;transform:none}
.tpop-wrap{position:absolute;top:58px;left:0;right:0;z-index:105;display:flex;justify-content:center;pointer-events:none}
.tpop{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:14px;background:linear-gradient(135deg,rgba(18,22,40,.96),rgba(10,12,22,.96));border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.6);transform:translateY(-90px);opacity:0;transition:.5s var(--ease);min-width:250px}
.tpop.show{transform:none;opacity:1}
.tpop.tier-plat{border-color:#cfe0f5;box-shadow:0 0 30px rgba(207,224,245,.35),0 12px 40px rgba(0,0,0,.6)}
.tp-ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.tp-t small{display:block;font-size:11px;color:var(--sub)}
.tp-t b{font-size:14px}
.ptc{position:absolute;z-index:120;pointer-events:none;font-style:normal;line-height:1}

/* ===== Common UI ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:14px;font-weight:700;font-size:13.5px;transition:transform .15s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-gold{background:var(--goldg);color:#2a1a02;box-shadow:0 6px 20px rgba(245,196,81,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-holo{background:var(--holo);color:#0B0D14;box-shadow:0 6px 20px rgba(155,92,255,.35)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.btn-blue{background:linear-gradient(135deg,#1677FF,#3EA0FF);color:#fff;box-shadow:0 6px 20px rgba(22,119,255,.35)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
.w100{width:100%}
.row-btns{display:flex;gap:8px;margin-top:12px}
.row-btns .btn{flex:1}
.sub{color:var(--sub);font-size:12px}
.gold{color:var(--gold)}.cyan{color:var(--cyan)}.pink{color:var(--pink)}.green{color:var(--green)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.sec-h h3{font-size:16px;letter-spacing:.5px}
.sec-h .sub{font-size:11px}
.seg{display:flex;padding:3px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:11px;font-size:12px;font-weight:600;color:var(--sub);transition:.25s;white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,rgba(245,196,81,.95),rgba(200,146,42,.95));color:#24170a;box-shadow:0 4px 14px rgba(245,196,81,.3)}
.seg.big button{padding:9px 4px;font-size:13px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pill{padding:5px 11px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);white-space:nowrap;transition:.2s}
.pill.on{background:rgba(245,196,81,.16);border-color:var(--gold);color:var(--gold)}
.pill.gold{border-color:rgba(245,196,81,.5);color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--sub);white-space:nowrap}
.tag.ok{background:rgba(61,220,151,.14);color:var(--green)}
.tag.gold{background:rgba(245,196,81,.14);color:var(--gold)}
.tag.cyan{background:rgba(62,240,255,.12);color:var(--cyan)}
.tag.pink{background:rgba(255,79,216,.13);color:var(--pink)}

.tro-counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0;position:relative}
.tc{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:12px;background:rgba(255,255,255,.04)}
.tc b{font:700 18px Georgia,serif;line-height:1.1;margin-top:2px}
.tc span{font-size:10px;color:var(--sub)}
.badge-wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;position:relative;perspective:600px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 2px}
.badge b{font-size:11.5px;line-height:1.3}
.badge small{font-size:9.5px;color:var(--sub)}
.badge.off b{color:var(--mute)}
.badge.fresh .coin{animation:coin 1.2s linear 3,glowC 1.2s 3}
.coin{width:58px;height:58px;margin:0 auto 6px;position:relative;transform-style:preserve-3d;animation:coin 7s linear infinite}
.badge.off .coin{animation:none;filter:grayscale(1) brightness(.45)}
.coin .f{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;font-size:25px;background:var(--tg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.4),inset 0 -6px 10px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.45)}
.coin .f.b{transform:rotateY(180deg)}
.coin .lock{position:absolute;right:-2px;bottom:-2px;font-size:14px;transform:translateZ(2px)}
.tier-plat{--tg:radial-gradient(circle at 30% 28%,#ffffff,#d6e6f8 35%,#7d95b8 85%)}
.tier-gold{--tg:radial-gradient(circle at 30% 28%,#fff3c4,#f5c451 42%,#a8721a 88%)}
.tier-silver{--tg:radial-gradient(circle at 30% 28%,#ffffff,#c9cfda 42%,#6f7888 88%)}
.tier-bronze{--tg:radial-gradient(circle at 30% 28%,#ffe0c6,#c77b45 46%,#6e3a18 88%)}
@keyframes coin{to{transform:rotateY(360deg)}}
@keyframes glowC{50%{filter:drop-shadow(0 0 14px #fff)}}
.fish-space{padding:14px;border-radius:22px;background:linear-gradient(160deg,rgba(255,154,61,.12),rgba(62,240,255,.06));border:1px solid rgba(255,170,90,.28)}
.tank{position:relative;height:150px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#0d3a5c 0%,#0a2340 60%,#081626 100%);border:1px solid rgba(62,240,255,.25)}
.tank::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 30px,rgba(255,255,255,.04) 30px 50px);animation:caustic 6s linear infinite}
@keyframes caustic{to{background-position:200px 0}}
.tank .sand{position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(180deg,#c9a46a,#8a6a3a);border-radius:50% 50% 0 0/30% 30% 0 0}
.tank .weed{position:absolute;bottom:14px;width:10px;height:50px;border-radius:50% 50% 0 0;background:linear-gradient(180deg,#3ddc97,#1a6a4a);transform-origin:bottom;animation:weed 3s ease-in-out infinite alternate}
@keyframes weed{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.tank-fish{position:absolute;left:50%;top:42%;width:120px;height:100px;transform:translate(-50%,-50%);animation:swim 9s ease-in-out infinite}
@keyframes swim{0%,100%{margin-left:-50px}50%{margin-left:50px}}
.fish-say{position:absolute;right:10px;top:10px;max-width:58%;font-size:11.5px;padding:6px 10px;border-radius:12px 12px 2px 12px;background:rgba(255,255,255,.92);color:#2a1a10;line-height:1.4;animation:fadeIn .4s}
.rice{position:absolute;top:-10px;font-size:14px;pointer-events:none;animation:riceFall 1.1s ease-in forwards}
@keyframes riceFall{to{transform:translateY(120px) rotate(200deg);opacity:0}}
.sat-row{display:flex;align-items:center;gap:8px;margin:12px 0 10px;font-size:12px}
.sat-bar{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.sat-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9a3d,#F5C451,#fff3c4);border-radius:5px;transition:width .8s var(--ease)}
.fish-btns{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
.fish-btns .btn{padding:9px 6px;font-size:12px}
.fs-h{font-size:13px;margin:14px 0 8px}
.map{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0a1020}
.map svg{display:block;width:100%}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topic{padding:6px 11px;border-radius:12px;font-size:12px;background:rgba(62,240,255,.1);border:1px solid rgba(62,240,255,.3);color:#c8f8ff}
.topic.off{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--mute)}
.phase2{margin-top:12px;padding:10px 12px;border-radius:14px;border:1.5px dashed rgba(61,220,151,.4);background:rgba(61,220,151,.06);font-size:12px;color:#bff5dc;display:flex;align-items:center;gap:8px}
.phase2 .tag{margin-left:auto}
.bom-box{padding:12px;border-radius:20px;background:linear-gradient(160deg,rgba(245,196,81,.08),rgba(255,255,255,.02));border:1px solid rgba(245,196,81,.25)}
.bom-hl{margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(245,196,81,.1);font-size:12.5px;line-height:1.5}
.bom-hl b{color:var(--gold);font-size:15px}
.set-list{border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.set-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);font-size:13.5px;text-align:left}
.set-item:last-child{border-bottom:0}
.switch{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.15);position:relative;transition:.25s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.switch.on{background:var(--green)}
.switch.on::after{left:21px}

/* ===== Chat ===== */
.chat-list{display:flex;flex-direction:column;gap:10px;height:330px;overflow-y:auto;padding:4px 2px 8px;scrollbar-width:none}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%;animation:pageIn .35s var(--ease)}
.msg .bub{padding:9px 12px;border-radius:16px 16px 16px 4px;background:rgba(255,255,255,.08);font-size:13px;line-height:1.5}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{border-radius:16px 16px 4px 16px;background:linear-gradient(135deg,#F5C451,#e0a93a);color:#2a1a02}
.msg .fav{width:34px;height:30px;flex:none}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sub);margin:0 2px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chat-in{display:flex;gap:8px}
.chat-in input{flex:1;min-width:0}

/* ===== NFC overlay ===== */
.nfc-ov{position:absolute;inset:0;z-index:88;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;background:radial-gradient(circle at 50% 38%,rgba(22,119,255,.38),rgba(4,7,16,.97) 62%);backdrop-filter:blur(10px);opacity:0;transition:opacity .3s}
.nfc-ov.show{opacity:1}
.nfc-brand{position:absolute;top:calc(var(--sb) + 18px);display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.ap-logo{width:26px;height:26px;border-radius:7px;background:#1677FF;display:grid;place-items:center;font-size:15px;color:#fff;font-weight:800}
.nfc-stage{position:relative;width:220px;height:220px}
.nfc-ring{position:absolute;inset:0}
.nfc-ring span{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(62,180,255,.85);opacity:0}
.nfc-ov.touch .nfc-ring span{animation:ripple 1.6s infinite ease-out}
.nfc-ring span:nth-child(2){animation-delay:.53s!important}.nfc-ring span:nth-child(3){animation-delay:1.06s!important}
.nfc-tag{position:absolute;left:50%;top:58%;width:96px;height:96px;margin-left:-48px;border-radius:24px;display:grid;place-items:center;font-size:44px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 40%,#141726),#0d0f18);border:1.5px solid var(--c);box-shadow:0 0 40px color-mix(in srgb,var(--c) 50%,transparent)}
.nfc-phone{position:absolute;left:50%;top:-6px;width:70px;height:128px;margin-left:-35px;border-radius:16px;background:linear-gradient(160deg,#2c3040,#12141c);border:2px solid #5c6170;box-shadow:0 20px 40px rgba(0,0,0,.6);transition:transform .55s cubic-bezier(.3,1.4,.5,1);display:grid;place-items:center}
.nfc-phone::before{content:"";position:absolute;top:6px;left:50%;width:22px;height:6px;margin-left:-11px;border-radius:3px;background:#000}
.nfc-phone svg{width:34px;height:34px;color:#3EA0FF}
.nfc-ov.touch .nfc-phone{transform:translateY(48px) rotate(-6deg)}
.nfc-title{margin-top:26px;font-size:16px;font-weight:700;text-align:center;min-height:24px}
.nfc-title .ok{color:var(--green)}
.nfc-steps{list-style:none;margin-top:16px;width:100%;max-width:310px;display:flex;flex-direction:column;gap:8px}
.nfc-steps li{display:flex;gap:10px;align-items:center;font-size:12.5px;opacity:.3;transition:opacity .3s}
.nfc-steps li.on{opacity:1}
.nfc-steps .ic{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.3);position:relative}
.nfc-steps li.on:not(.done) .ic{border-color:var(--cyan);border-top-color:transparent;animation:spin .7s linear infinite}
.nfc-steps li.done .ic{background:var(--green);border-color:var(--green)}
.nfc-steps li.done .ic::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#062a1a;font-weight:900}
.nfc-cancel{position:absolute;bottom:50px;font-size:13px;color:var(--sub);padding:8px 20px;border-radius:16px;background:rgba(255,255,255,.06)}

/* ===== Scenes ===== */
.verify{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(61,220,151,.16),rgba(61,220,151,.03));border:1px solid rgba(61,220,151,.4);font-size:12px}
.verify .vi{width:30px;height:30px;flex:none;border-radius:50%;background:var(--green);color:#062a1a;display:grid;place-items:center;font-weight:900}
.verify b{color:var(--green)}
.gps-card{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:rgba(62,240,255,.06);border:1px solid rgba(62,240,255,.28)}
.gps-map{width:118px;height:118px;flex:none;border-radius:14px;overflow:hidden}
.gps-map svg{width:100%;height:100%;display:block}
.gps-info{font-size:12px;line-height:1.6;min-width:0}
.gps-info .okl{color:var(--green);font-weight:700;font-size:13px}
.puzzle-wrap{margin-top:12px;padding:12px;border-radius:18px;background:linear-gradient(160deg,rgba(245,196,81,.1),rgba(255,255,255,.02));border:1px solid rgba(245,196,81,.25)}
.pz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.pz-count{font:800 22px Georgia,serif;color:var(--gold);transition:.3s}
.pz-count.done{color:var(--green);text-shadow:0 0 14px var(--green)}
.puzzle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3px;width:250px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pz{position:relative;aspect-ratio:1;overflow:hidden;background:#222}
.pz svg{display:block;width:100%;height:100%;filter:grayscale(1) brightness(.3);transition:filter .6s}
.pz.lit svg{filter:none}
.pz em{position:absolute;inset:0;display:grid;place-items:center;font:800 34px Georgia,serif;color:rgba(255,255,255,.35);font-style:normal;transition:opacity .4s}
.pz.lit em{opacity:0}
.pz span{position:absolute;left:4px;bottom:4px;font-size:9.5px;padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff}
.pz.fly{animation:pzFly 1s var(--ease)}
@keyframes pzFly{0%{transform:translate(60px,-80px) rotate(25deg) scale(1.4);opacity:0;box-shadow:0 0 40px var(--gold)}60%{opacity:1}100%{transform:none}}
.pz.fly::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 30px rgba(245,196,81,.8);animation:fadeIn .4s reverse 1s forwards}
.reward{display:none;margin-top:12px}
.reward.show{display:block;animation:pageIn .6s var(--ease)}
.complete{text-align:center;font:800 22px "Songti SC",serif;letter-spacing:3px;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(245,196,81,.5))}
.pin{width:120px;height:120px;margin:8px auto;animation:floatY 3s infinite}
.pin svg{width:100%;height:100%;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.redeem{padding:12px;border-radius:16px;background:#f7efe0;color:#2a1a08;position:relative;text-align:center}
.redeem::before,.redeem::after{content:"";position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#0B0D14}
.redeem::before{left:-9px}.redeem::after{right:-9px}
.redeem .code{color:#8a1a1a;font-size:20px;letter-spacing:3px}
.redeem .sub{color:#6a5a40}
.redeem .pill{background:#2a1a08;color:#f7efe0;border:0;margin-top:4px}
.encounter{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px;border-radius:16px;background:rgba(255,154,61,.08);border:1px solid rgba(255,154,61,.28)}
.encounter .ef{width:60px;height:52px;flex:none}
.enc-lines{flex:1;font-size:12.5px;line-height:1.55;min-height:60px}
.enc-lines p{margin-bottom:4px;animation:fadeIn .3s}
.box-stage{position:relative;height:350px;display:grid;place-items:center;margin:8px -16px 0;overflow:hidden}
.rays{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(245,196,81,.32) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%);opacity:0;pointer-events:none}
.rays-wrap{position:absolute;inset:0;pointer-events:none;transform:scale(.2);opacity:0;transition:transform 1s var(--ease),opacity .6s}
.box-stage.open .rays-wrap{transform:scale(1);opacity:1}
.box-stage.open .rays{opacity:1;animation:spin 18s linear infinite}
.bbox{position:absolute;width:150px;height:160px;animation:shake .14s ease-in-out infinite alternate;z-index:3}
@keyframes shake{from{transform:rotate(-3deg) translateX(-2px)}to{transform:rotate(3deg) translateX(2px)}}
.bbox-body{position:absolute;left:0;right:0;bottom:0;height:126px;border-radius:12px;background:linear-gradient(135deg,#7a1420,#c8323a 50%,#5a0e18);border:2px solid var(--gold);display:grid;place-items:center;text-align:center;font-family:"Songti SC",serif;color:var(--gold2);font-size:15px;letter-spacing:3px;box-shadow:0 20px 50px rgba(200,50,58,.45);transition:all .6s .25s}
.bbox-body small{display:block;font:600 9px sans-serif;letter-spacing:2px;color:#ffd0a0;margin-top:4px}
.bbox-lid{position:absolute;left:-8px;right:-8px;top:10px;height:34px;border-radius:9px;background:linear-gradient(135deg,#a01c28,#e04a52);border:2px solid var(--gold);transition:transform .7s cubic-bezier(.3,1.5,.5,1),opacity .7s;z-index:1}
.bbox-lid::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:18px;margin-left:-9px;background:var(--goldg)}
.box-stage.open .bbox{animation:none;pointer-events:none}
.box-stage.open .bbox-lid{transform:translate(90px,-200px) rotate(50deg);opacity:0}
.box-stage.open .bbox-body{transform:translateY(80px) scale(.6);opacity:0}
.reveal{position:absolute;opacity:0;transform:translateY(80px) scale(.3) rotateY(540deg);z-index:4}
.box-stage.open .reveal{animation:reveal 1.2s .45s cubic-bezier(.2,1.25,.4,1) forwards}
@keyframes reveal{to{opacity:1;transform:none}}
.ssr-title{text-align:center;margin-top:4px;opacity:0;transition:opacity .6s}
.ssr-title.show{opacity:1}
.ssr-title b{font:800 18px "Songti SC",serif;letter-spacing:2px;background:linear-gradient(90deg,#ff4fd8,#f5c451,#3ef0ff,#9b5cff,#ff4fd8);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holoText 3s linear infinite}
@keyframes holoText{to{background-position:200% 0}}
.aud{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-top:8px}
.play-btn{width:42px;height:42px;flex:none;border-radius:50%;background:var(--goldg);color:#2a1a02;font-size:15px;display:grid;place-items:center;box-shadow:0 0 16px rgba(245,196,81,.4)}
.play-btn.on{background:var(--holo);animation:blink 1s infinite}
.aud-t{flex:1;min-width:0}
.aud-t b{font-size:13px;display:block}
canvas.spec{display:block;width:100px;height:36px}
canvas.spec.big{width:100%;height:64px;margin-top:10px}
.lyric{text-align:center;font-family:KaiTi,STKaiti,serif;font-size:14px;color:#f3e9ff;margin-top:10px;min-height:44px;line-height:1.6}
.coaster-stage{position:relative;height:250px;display:grid;place-items:center}
.pack{position:absolute;width:200px;height:220px;border-radius:16px;background:linear-gradient(160deg,#2a1450,#120a24);border:1.5px solid rgba(245,196,81,.6);display:grid;place-items:center;text-align:center;font:700 15px "Songti SC",serif;color:var(--gold2);letter-spacing:2px;box-shadow:0 20px 40px rgba(155,92,255,.3);animation:shake .16s infinite alternate;z-index:2;transition:transform .6s .3s,opacity .6s .3s}
.pack small{display:block;font:600 9px sans-serif;letter-spacing:2px;color:var(--pink);margin-top:4px}
.pack .tear{position:absolute;top:0;left:0;right:0;height:44px;border-radius:14px 14px 0 0;background:linear-gradient(90deg,#3a1d6a,#5a2a9a);clip-path:polygon(0 0,100% 0,100% 80%,95% 100%,90% 80%,85% 100%,80% 80%,75% 100%,70% 80%,65% 100%,60% 80%,55% 100%,50% 80%,45% 100%,40% 80%,35% 100%,30% 80%,25% 100%,20% 80%,15% 100%,10% 80%,5% 100%,0 80%);transition:transform .6s,opacity .6s}
.coaster-stage.open .pack{animation:none;transform:translateY(160px) scale(.8);opacity:0}
.coaster-stage.open .tear{transform:translate(40px,-90px) rotate(-25deg);opacity:0}
.coaster{width:220px;height:220px;border-radius:50%;overflow:hidden;opacity:0;transform:scale(.5) rotate(-120deg);box-shadow:0 0 0 3px rgba(245,196,81,.5),0 20px 50px rgba(62,240,255,.3)}
.coaster svg{width:100%;height:100%;display:block}
.coaster-stage.open .coaster{animation:coasterIn 1.1s .5s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes coasterIn{to{opacity:1;transform:none}}
.ckt{margin-top:10px;padding:14px;border-radius:18px;background:linear-gradient(160deg,rgba(62,240,255,.08),rgba(255,79,216,.05));border:1px solid rgba(62,240,255,.25);animation:fadeIn .4s}
.ckt h4{font:800 19px "Songti SC",serif}
.ckt .story{font-size:12.5px;line-height:1.65;color:#d9dcef;margin:8px 0}
.ckt ul{list-style:none;font-size:12px;display:grid;gap:3px}
.ckt li::before{content:"◆ ";color:var(--pink);font-size:9px}
.ckt-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ckt-grid{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px;align-items:center}
.flavor svg{width:150px;height:150px;display:block}
.book-stage{position:relative;height:340px;margin-top:6px}
.poker{position:absolute;left:50%;top:0;width:120px;height:168px;margin-left:-60px;perspective:800px;z-index:3;transition:transform .9s cubic-bezier(.5,0,.3,1)}
.poker-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s;transform:rotateY(180deg)}
.poker.shown .poker-in{transform:none}
.poker .pf,.poker .pb2{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.poker .pf svg,.poker .pb2 svg{width:100%;height:100%;display:block}
.poker .pb2{transform:rotateY(180deg)}
.poker.placed{transform:translate(78px,196px) scale(.36) rotate(10deg)}
.tt{position:absolute;left:50%;bottom:0;width:270px;height:170px;margin-left:-135px;border-radius:18px;background:linear-gradient(160deg,#4a3420,#24170c);box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18);border:1px solid rgba(245,196,81,.35)}

/* ================= Events & init ================= */
document.addEventListener('click', e => {
  const cl = e.target.closest('[data-close]'); if (cl) { closeModal(cl.closest('.modal')); return; }
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  const fn = ACT[a.dataset.act]; if (fn) { e.stopPropagation(); fn(a, e); }
});
document.addEventListener('keydown', e => {
  const tg = e.target;
  if (e.key === 'Enter' && tg.dataset && tg.dataset.enter) { e.preventDefault(); const fn = ACT[tg.dataset.enter]; fn && fn(tg); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(tg.tagName)) return;
  if (e.key === 'Escape') closeModal();
  const n = +e.key; if (n >= 1 && n <= 5) runScene(SCENES[n - 1].id);
});
document.addEventListener('input', e => {
  const tg = e.target;
  if (tg.classList.contains('ar-scale')) { S.ar.s = tg.value / 100; tg.closest('.ar').querySelector('.ar-card').style.setProperty('--s', S.ar.s); const z = tg.closest('.ar').querySelector('.ar-zoom'); if (z) z.textContent = S.ar.s.toFixed(1) + '×'; }
  const calc = tg.closest && tg.closest('.calc'); if (calc && !tg.classList.contains('c-preset')) calcUpdate(calc);
});
function fit() {
  const wrap = $('#phoneWrap'), ph = $('#phone');
  if (innerWidth <= 760) { wrap.style.width = wrap.style.height = ''; ph.style.transform = ''; return; }
  let s = Math.min(1, (innerHeight - 32) / 898); if (innerWidth <= 1180) s = Math.min(s, (innerWidth - 40) / 426);
  s = Math.max(.45, s); ph.style.transform = `scale(${s})`; wrap.style.width = 426 * s + 'px'; wrap.style.height = 898 * s + 'px';
}
window.addEventListener('resize', fit);
setInterval(() => { $('#sbTime').textContent = hm(); $$('.countdown').forEach(el => { el.textContent = fmtLeft(Math.max(0, +el.dataset.exp - Date.now())); }); }, 1000);
const TICKS = () => [`🫧 正在吐泡泡 · 饱食度 ${S.fish.sat}%`, `🗺 已陪你去过 ${Object.keys(PLACES).filter(k => !PLACES[k].locked).length} 座城市`, '💤 偷偷打了个盹……才没有！', '🍚 在想今晚的白米饭', '♪ 哼着「碰一碰呀收闪卡」'];
let tickI = 0; setInterval(() => { const tk = $('#fishTicker'); if (tk && !singing) tk.textContent = TICKS()[++tickI % 5]; }, 4000);
setInterval(() => { if (S.fish.sat > 30) { S.fish.sat--; const b = $('#satBar'), n = $('#satNum'); if (b) b.style.width = S.fish.sat + '%'; if (n) n.textContent = S.fish.sat + '%'; updateKPIs(); } }, 45000);
function init() {
  renderConsole(); renderTabbar();
  ['home', 'collect', 'discover', 'me'].forEach(renderPage);
  $('#page-home').classList.add('active'); $('#navTitle').textContent = t('nav_home'); $('#sbTime').textContent = hm(); fit();
}
init();
